<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Chatbot</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .chat-container {
            width: 400px;
            height: 600px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            background-color: #4285f4;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        
        .user-message {
            justify-content: flex-end;
        }
        
        .bot-message {
            justify-content: flex-start;
        }
        
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        
        .user-message .message-content {
            background-color: #4285f4;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .bot-message .message-content {
            background-color: #f1f1f1;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #eee;
            background-color: #f9f9f9;
        }
        
        #user-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        
        #send-button {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        
        #send-button:hover {
            background-color: #3367d6;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background-color: #f1f1f1;
            color: #333;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            margin-bottom: 15px;
            width: fit-content;
        }
        
        .typing-indicator span {
            animation: typing-dots 1.5s infinite;
            display: inline-block;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing-dots {
            0% { opacity: 0.2; }
            50% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            JavaScript Chatbot
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="typing-indicator" id="typing-indicator">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
            <button id="send-button">Send</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const sendButton = document.getElementById('send-button');
            const typingIndicator = document.getElementById('typing-indicator');
            
            // Initial bot greeting
            setTimeout(() => {
                addBotMessage("Hello! I'm a JavaScript chatbot. How can I help you today?");
            }, 500);
            
            // Send message when button is clicked
            sendButton.addEventListener('click', sendMessage);
            
            // Send message when Enter key is pressed
            userInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            function sendMessage() {
                const message = userInput.value.trim();
                if (message === '') return;
                
                // Add user message to chat
                addUserMessage(message);
                userInput.value = '';
                
                // Show typing indicator
                typingIndicator.style.display = 'block';
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // Simulate bot thinking
                setTimeout(() => {
                    typingIndicator.style.display = 'none';
                    const botResponse = generateBotResponse(message);
                    addBotMessage(botResponse);
                }, 1000 + Math.random() * 2000); // Random delay between 1-3 seconds
            }
            
            function addUserMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user-message';
                messageDiv.innerHTML = `<div class="message-content">${escapeHtml(message)}</div>`;
                chatMessages.insertBefore(messageDiv, typingIndicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            function addBotMessage(message) {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot-message';
                messageDiv.innerHTML = `<div class="message-content">${message}</div>`;
                chatMessages.insertBefore(messageDiv, typingIndicator);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            function escapeHtml(unsafe) {
                return unsafe
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }
            
            function generateBotResponse(userMessage) {
                const lowerCaseMessage = userMessage.toLowerCase();
                
                // Simple response logic
                if (lowerCaseMessage.includes('hello') || lowerCaseMessage.includes('hi')) {
                    return "Hello there! How are you doing today?";
                } else if (lowerCaseMessage.includes('how are you')) {
                    return "I'm just a chatbot, but I'm functioning perfectly! Thanks for asking.";
                } else if (lowerCaseMessage.includes('your name')) {
                    return "I'm JavaScript Chatbot, but you can call me JSC!";
                } else if (lowerCaseMessage.includes('help')) {
                    return "I can answer questions about myself, tell you the time, or just chat. What would you like to know?";
                } else if (lowerCaseMessage.includes('time')) {
                    return `The current time is ${new Date().toLocaleTimeString()}.`;
                } else if (lowerCaseMessage.includes('date')) {
                    return `Today's date is ${new Date().toLocaleDateString()}.`;
                } else if (lowerCaseMessage.includes('thank')) {
                    return "You're welcome! Is there anything else I can help you with?";
                } else if (lowerCaseMessage.includes('bye') || lowerCaseMessage.includes('goodbye')) {
                    return "Goodbye! Feel free to come back if you have more questions.";
                } else if (lowerCaseMessage.includes('weather')) {
                    return "I'm sorry, I don't have access to weather data. I'm just a simple chatbot!";
                } else if (lowerCaseMessage.includes('joke')) {
                    const jokes = [
                        "Why don't scientists trust atoms? Because they make up everything!",
                        "Did you hear about the mathematician who's afraid of negative numbers? He'll stop at nothing to avoid them!",
                        "Why don't skeletons fight each other? They don't have the guts!",
                        "I'm reading a book about anti-gravity. It's impossible to put down!",
                        "Why did the scarecrow win an award? Because he was outstanding in his field!"
                    ];
                    return jokes[Math.floor(Math.random() * jokes.length)];
                } else {
                    const randomResponses = [
                        "That's interesting! Tell me more.",
                        "I'm not sure I understand. Could you rephrase that?",
                        "I'm still learning. Could you ask me something else?",
                        "Interesting point! What else would you like to discuss?",
                        "I'm afraid I don't have an answer for that. Maybe try asking me something else?"
                    ];
                    return randomResponses[Math.floor(Math.random() * randomResponses.length)];
                }
            }
        });
    </script>
</body>
</html>
